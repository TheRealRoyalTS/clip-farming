# Local hooks: they use the ruff from the project's dev dependencies, so there is no second
# version to keep in sync. Install with: pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: ruff format --check
        language: system
        types: [python]
