[project]
name = "clipfarm"
version = "0.1.0"
description = "Detect viral moments in Twitch streams from chat activity and cut 9:16 clips into an approval queue."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "TheRealRoyalTS" }]
requires-python = ">=3.11"
dependencies = ["streamlink>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
clipfarm = "clipfarm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipfarm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
